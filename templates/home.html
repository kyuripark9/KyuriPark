    <h1 class="visually-hidden">Selected work</h1>
    <section class="track" aria-roledescription="carousel" aria-label="Work" data-intro="{{ intro_line }}">
      <div class="track-stage">
{{ tabs }}
        <div class="track-panel"{{ panel }}>
          <ul class="track-row" id="track-row" role="list">
{{ cards }}
          </ul>
          <p class="track-caption" aria-live="polite">{{ caption }}</p>
        </div>
      </div>
    </section>
{{ lightbox }}
    <script src="/assets/js/track.js?v={{ track_version }}" defer></script>
    <script>
      // The intro, on the first visit to Home in a browser session: a black screen with the name
      // and role in the middle and each project's cover in turn in the corner. They come into
      // focus, hold, and blur away; then the black blurs and fades, and the page shows. Timing
      // as in the preloader on titarvl.framer.website. A click, key, or wheel skips to the end;
      // with reduced motion there's no intro. Until the page shows, style.css keeps the header
      // and the track hidden.
      (() => {
        const DELAY = 350;       // ms of plain black first
        const FADE_IN = 500;     // ms: the line and the image come into focus
        const HOLD = 800;        // ms they stay in focus
        const FADE_OUT = 1000;   // ms: they blur and fade away
        const REVEAL = 1000;     // ms: the black blurs and fades, and the page shows
        const FLICK = 150;       // ms each cover stays in the corner
        const BLUR = 10;         // px: how blurred the line and the image are at both ends
        const REVEAL_BLUR = 20;  // px: how blurred the black is at the end
        const SEEN = "home-intro-seen";  // sessionStorage key

        const html = document.documentElement;
        let show = false;
        try {
          show = !sessionStorage.getItem(SEEN) && !matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {
          // Storage blocked: no intro, rather than one on every visit.
        }
        if (!show) {
          html.classList.add("intro-done");
          return;
        }

        const intro = document.createElement("div");
        intro.className = "intro";
        intro.setAttribute("aria-hidden", "true");
        const line = document.createElement("p");
        line.className = "intro-line";
        line.textContent = document.querySelector(".track").dataset.intro;
        // Copies of the projects' covers (cards hidden for now, like the Archive's, are left
        // out), stacked; one shows at a time, from the first project on.
        const image = document.createElement("div");
        image.className = "intro-image";
        const covers = [...document.querySelectorAll(".track-item:not([hidden]) .track-media")].map((media, i) => {
          const copy = media.cloneNode(true);
          if (i) copy.style.visibility = "hidden";
          image.append(copy);
          return copy;
        });
        intro.append(line, image);
        document.body.append(intro);

        // Into focus, held, out of focus: one animation for the whole time they're on screen.
        const blur = `blur(${BLUR}px)`;
        const onScreen = FADE_IN + HOLD + FADE_OUT;
        const anims = [line, image].map((el) => el.animate([
          { opacity: 0, filter: blur, easing: "ease-out" },
          { opacity: 1, filter: "blur(0px)", offset: FADE_IN / onScreen },
          { opacity: 1, filter: "blur(0px)", offset: (FADE_IN + HOLD) / onScreen, easing: "ease-in" },
          { opacity: 0, filter: blur },
        ], { duration: onScreen, delay: DELAY, fill: "both" }));

        let shown = 0;
        const flick = setInterval(() => {
          covers[shown].style.visibility = "hidden";
          shown = (shown + 1) % covers.length;
          covers[shown].style.visibility = "";
        }, FLICK);

        // The page shows under the black, which blurs and fades. From here, input reaches the
        // page (and still ends the intro).
        let revealing = false;
        const reveal = () => {
          clearInterval(flick);
          revealing = true;
          html.classList.add("intro-done");
          intro.style.pointerEvents = "none";
          addEventListener("pointerdown", end);
          anims.push(intro.animate({ opacity: [1, 0], filter: ["blur(0px)", `blur(${REVEAL_BLUR}px)`] },
            { duration: REVEAL, easing: "ease-in-out", fill: "forwards" }));
          anims.at(-1).onfinish = end;
        };
        anims[0].onfinish = reveal;

        const end = () => {
          clearInterval(flick);
          removeEventListener("keydown", skipKey, true);
          removeEventListener("wheel", end);
          removeEventListener("pointerdown", end);
          html.classList.add("intro-done");
          anims.forEach((a) => a.cancel());
          intro.remove();
          try {
            sessionStorage.setItem(SEEN, "1");
          } catch (e) {
            // Storage blocked: nothing to remember it in.
          }
        };

        // On the black screen, a key only skips the intro: the track doesn't move.
        const skipKey = (e) => {
          if (!revealing) e.stopPropagation();
          end();
        };
        addEventListener("keydown", skipKey, true);
        addEventListener("wheel", end, { passive: true });
        intro.addEventListener("click", end);
      })();
    </script>
