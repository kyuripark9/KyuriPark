<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  {{ head_meta }}
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  {{ wordmark_font }}
  <link rel="stylesheet" href="/assets/css/style.css?v={{ css_version }}">
  <script src="/assets/js/main.js?v={{ js_version }}" defer></script>
</head>
<body data-page="{{ page_name }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header wrap">
    <a class="identity" href="/">
      <span class="wordmark">{{ site_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-menu">
        <li><a href="/work/"{{ nav_work }}>Work</a></li>
        <li><a href="/archive/"{{ nav_archive }}>Archive</a></li>
        <li><a href="/about/"{{ nav_about }}>About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="{{ main_class }}">
{{ content }}
  </main>

{{ footer }}</body>
</html>
