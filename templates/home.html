    <h1 class="visually-hidden">Selected work</h1>
    <section class="track" aria-roledescription="carousel" aria-label="Selected work">
      <div class="track-stage">
        <ul class="track-row" id="track-row" role="list">
{{ cards }}
        </ul>
      </div>

      <div class="track-bar wrap">
        <div class="track-controls">
          <button class="track-arrow" type="button" aria-label="Previous project" aria-controls="track-row">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M13 8H3M7 4 3 8l4 4"/></svg>
          </button>
          <button class="track-arrow" type="button" aria-label="Next project" aria-controls="track-row">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </button>
        </div>
        <p class="track-caption" aria-live="polite">{{ caption }}</p>
        <a class="bracket-link" href="/work/" aria-label="View all projects">[ view all ]</a>
      </div>
    </section>
    <script src="/assets/js/track.js?v={{ track_version }}" defer></script>
