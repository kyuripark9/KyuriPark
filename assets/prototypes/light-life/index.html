<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light Life prototype</title>
<meta name="robots" content="noindex">
<link rel="preload" href="../../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.6 10.2A6 6 0 0 1 5.8 2.4a6 6 0 1 0 7.8 7.8Z" fill="currentColor"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 2.8v10.4L13.2 8 5 2.8Z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M4 2.8h2.7v10.4H4zM9.3 2.8H12v10.4H9.3z" fill="currentColor"/></symbol>
  <symbol id="i-now" viewBox="0 0 16 16"><path d="M8 3.5A5 5 0 1 1 3.3 6.8M10 1.5 8 3.5l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pin" viewBox="0 0 16 16"><path d="M8 14.6s4.6-4.3 4.6-8a4.6 4.6 0 1 0-9.2 0c0 3.7 4.6 8 4.6 8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="6.5" r="1.6" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-updown" viewBox="0 0 16 16"><path d="m5 6 3-3 3 3M5 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.4 3 3 6-6.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <!-- Scene icons: each scene as one plain picture of where it is (the 2023 app's names). Line
       icons, drawn on a 16px grid inside a 13px square; their stroke (1.5px, round) is set in
       app.css (.scene-icon), the weight of the text beside them. -->
  <symbol id="sc-before-sunrise" viewBox="0 0 16 16"><path d="M1.75 13h12.5M4.5 13a3.5 3.5 0 0 1 7 0M8 2.25v4.5M5.9 4.35 8 2.25l2.1 2.1"/></symbol>   <!-- sun about to rise -->
  <symbol id="sc-prairie" viewBox="0 0 16 16"><path d="M2 14.25h12M8 14.25V4M5.25 14.25C5.1 11 4.2 8.7 2.6 7M10.75 14.25c.15-3.25 1.05-5.55 2.65-7.25"/></symbol>   <!-- prairie grass -->
  <symbol id="sc-mountains" viewBox="0 0 16 16"><path d="M1.5 11.25 5.75 4.5l3.1 4.75 1.65-2.25 4 4.25ZM4 14.25h8"/></symbol>   <!-- mountains over mist -->
  <symbol id="sc-sands" viewBox="0 0 16 16"><path d="M1.5 12.5c2.6 0 5-6 8-6 2.1 0 3.6 2.4 5 6ZM9.5 6.5c.4 2.4-.7 4.5-2.9 6"/></symbol>   <!-- a dune -->
  <symbol id="sc-sydney" viewBox="0 0 16 16"><path d="M1.5 13.75h13M2.25 13.75 1.9 9.6c1.9.3 3.4 1.9 3.75 4.15M5.65 13.75 5.2 6.6c2.6.4 4.2 3.2 4.45 7.15M9.65 13.75 9.1 2.6c3 .5 5.1 4.8 5.15 11.15"/></symbol>   <!-- the Opera House's sails -->
  <symbol id="sc-fresh-breeze" viewBox="0 0 16 16"><path d="M6.4 9.2a1.9 1.9 0 0 1-.2-3.77 2.6 2.6 0 0 1 5.27 0 1.9 1.9 0 0 1-.2 3.77ZM1.75 12h9.5a1.6 1.6 0 1 1-1.6 1.6"/></symbol>   <!-- a cloud and a breeze -->
  <symbol id="sc-high-sky" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></symbol>   <!-- the sun -->
  <symbol id="sc-seoul" viewBox="0 0 16 16"><path d="M6.25 14.5 7.25 7.5h1.5l1 7M4.5 14.5h7M8 4.5V1.5"/><rect x="5.5" y="4.5" width="5" height="3" rx="1.5"/></symbol>   <!-- N Seoul Tower -->
  <symbol id="sc-clouds" viewBox="0 0 16 16"><path d="M4.75 12.5a2.5 2.5 0 0 1-.25-4.99 3.5 3.5 0 0 1 7 0 2.5 2.5 0 0 1-.25 4.99Z"/></symbol>   <!-- a cloud -->
  <symbol id="sc-gold" viewBox="0 0 16 16"><path d="M1.5 13h13M4.5 13a3.5 3.5 0 0 1 7 0M8 7.75v-2M11.9 9.1l1.4-1.4M4.1 9.1 2.7 7.7"/></symbol>   <!-- the sun low, rays up -->
  <symbol id="sc-la" viewBox="0 0 16 16"><path d="M9.1 14.5c0-3-.45-5.6-1.6-8M7.5 6.5C6.3 4.5 4 3.9 2 5.1M7.5 6.5C7.3 4.2 5.9 2.55 3.9 2M7.5 6.5c.8-2.3 2.7-3.6 4.9-3.4M7.5 6.5c2-1.1 4.5-.7 6 1.4"/></symbol>   <!-- a palm -->
  <symbol id="sc-beach" viewBox="0 0 16 16"><path d="M2.5 8.25a5.5 5.5 0 0 1 11 0ZM8 8.25v6.25M3.5 14.5h9"/></symbol>   <!-- a beach umbrella -->
  <symbol id="sc-sunset" viewBox="0 0 16 16"><path d="M1.75 13h12.5M4.5 13a3.5 3.5 0 0 1 7 0M8 2.25v4.5M5.9 4.65 8 6.75l2.1-2.1"/></symbol>   <!-- sun going down -->
  <symbol id="sc-sun-sea" viewBox="0 0 16 16"><path d="M1.5 9.5h13M4.75 9.5a3.25 3.25 0 0 1 6.5 0M1.5 13.25q1.625-1.5 3.25 0t3.25 0 3.25 0 3.25 0"/></symbol>   <!-- the sun on the sea -->
  <symbol id="sc-ocean" viewBox="0 0 16 16"><path d="M1.5 4.5q1.625-1.5 3.25 0t3.25 0 3.25 0 3.25 0M1.5 8.5q1.625-1.5 3.25 0t3.25 0 3.25 0 3.25 0M1.5 12.5q1.625-1.5 3.25 0t3.25 0 3.25 0 3.25 0"/></symbol>   <!-- waves -->
  <symbol id="sc-lights-off" viewBox="0 0 16 16"><path d="M8 1.75v5.5M4.6 3.9a5.5 5.5 0 1 0 6.8 0"/></symbol>   <!-- power off -->
  <symbol id="sc-night-light" viewBox="0 0 16 16"><path d="M14.25 8.6A6.4 6.4 0 1 1 7.4 1.75a5 5 0 0 0 6.85 6.85Z"/></symbol>   <!-- the moon -->
  <!-- Weather where you live, at the top: clear (the sun, or the moon at night), partly cloudy,
       cloudy, fog, rain, snow, storm. A cloud in front of something wears a gap the color of
       the screen. -->
  <symbol id="w-partly-day" viewBox="0 0 16 16"><circle cx="5.6" cy="5.6" r="2.3" fill="currentColor"/><path d="M5.6 1.2v1M1.2 5.6h1M2.5 2.5l.7.7M8.7 2.5l-.7.7M2.5 8.7l.7-.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path transform="translate(4 4.3) scale(.78)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor" stroke="#0a0a0b" stroke-width="2.4" paint-order="stroke"/></symbol>
  <symbol id="w-partly-night" viewBox="0 0 16 16"><path transform="translate(.3 .3) scale(.66)" d="M13.6 10.2A6 6 0 0 1 5.8 2.4a6 6 0 1 0 7.8 7.8Z" fill="currentColor"/><path transform="translate(4 4.3) scale(.78)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor" stroke="#0a0a0b" stroke-width="2.4" paint-order="stroke"/></symbol>
  <symbol id="w-cloud" viewBox="0 0 16 16"><path transform="translate(0 .4)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor"/></symbol>
  <symbol id="w-fog" viewBox="0 0 16 16"><path d="M2.5 5h11M4 8h9.5M2.5 11h8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="w-rain" viewBox="0 0 16 16"><path transform="translate(0 -2.6)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor"/><path d="m5.6 12-.8 2.2M8.6 12l-.8 2.2M11.6 12l-.8 2.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="w-snow" viewBox="0 0 16 16"><path transform="translate(0 -2.6)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor"/><circle cx="5.2" cy="13" r="1" fill="currentColor"/><circle cx="8.2" cy="14.2" r="1" fill="currentColor"/><circle cx="11.2" cy="13" r="1" fill="currentColor"/></symbol>
  <symbol id="w-storm" viewBox="0 0 16 16"><path transform="translate(0 -2.6)" d="M4.5 12.5h7.2a2.6 2.6 0 0 0 .3-5.2 3.6 3.6 0 0 0-6.9-.4A2.9 2.9 0 0 0 4.5 12.5Z" fill="currentColor"/><path d="M8.9 9.4 6.3 12.9h2.2l-1 2.6 3.1-3.8H8.4l.5-2.3Z" fill="currentColor" stroke="#0a0a0b" stroke-width="1" paint-order="stroke" stroke-linejoin="round"/></symbol>
</svg>

<div class="device" id="device">
  <div class="status" aria-hidden="true"><span id="status-time">9:41</span></div>
  <!-- The phone's camera, the pill at the top center, in gray so it reads on the black screen. -->
  <span class="island" aria-hidden="true"></span>

  <main class="app">
    <!-- No logo at the top (the user's ask, 2026-11-15): the lamp is the product, so the
         screen opens on where you live and the time there. -->

    <!-- Where you live, in one quiet line: the weather there now as an icon (a pin until the
         forecast arrives) and the city's name; the line opens the city search. No time here
         and no Back to now button (the user, 2026-11-15: too many things for what they say):
         the time showing is on the day's ruler, at its yellow mark, and now is a ring there
         while you look at another time; tap the ring to come back. Your two times are on the
         ruler too, where your day starts and ends. The part of the day showing is named for
         screen readers only (the user, 2026-11-15: "Daytime" said nothing the screen doesn't:
         the time, the ruler, and the color's name, CLEAR-DAY BLUE, already tell it).
         Over it, the scene playing for the part showing, as the screen's title: its picture,
         its name in big plain type, and a small up-down mark, no box (the user's asks,
         2026-11-15: up from under the lamp, then out of its chip). Tap it for the part's
         scenes, in a sheet that comes up from the bottom. -->
    <div class="now-head">
      <h1 class="visually-hidden" id="part">Morning</h1>
      <button class="scene-title" type="button" id="scene" aria-haspopup="dialog"><svg class="scene-icon" aria-hidden="true"><use id="scene-icon" href="#sc-high-sky"/></svg><span id="scene-name">High blue sky</span><svg class="scene-chevron" aria-hidden="true"><use href="#i-updown"/></svg></button>
      <button class="place" type="button" id="place" aria-haspopup="dialog"><svg class="icon weather-icon" aria-hidden="true"><use id="weather-use" href="#i-pin"/></svg><span class="place-text" id="place-text">Chicago</span></button>
    </div>

    <!-- The lamp, built like the real one: two parts, apart, each with its own light and its
         own job. The head, a circle that glows white at its edge: sunlight that shines on you.
         The base under it, a pill that fills with color, brightest at its edge: it colors your
         space (turned by hand, on the lamp). Each part shows only its strength in plain type, the
         base's smaller and in white. No labels (the user, 2026-11-15: the scene title at the
         top already names what's playing, so SUNLIGHT and the color's name, EARLY-SUNSET BLUE,
         said it twice); screen readers still hear each light's name on its ruler.
         Drag either one, or its ruler, to set how strong it is for the part of the day showing. -->
    <section class="lamp" aria-label="The lamp">
      <div class="lamp-head" id="head">
        <span class="lamp-fill sun-fill" id="sun-fill" aria-hidden="true"></span>
        <span class="disc-value" aria-hidden="true"><span class="disc-num" id="sun-value">0</span><span class="disc-unit">%</span></span>
        <div class="ll-tape" id="sun-tape" role="slider" tabindex="0" aria-label="Sunlight" aria-valuemin="0" aria-valuemax="100">
          <span class="ll-tape-window"><span class="ll-tape-track"></span></span>
          <span class="ll-tape-mark" aria-hidden="true"></span>
        </div>
      </div>
      <div class="lamp-base" id="base">
        <span class="lamp-fill" id="color-fill" aria-hidden="true"></span>
        <span class="disc-value" aria-hidden="true"><span class="disc-num" id="color-value">0</span><span class="disc-unit">%</span></span>
        <div class="ll-tape" id="color-tape" role="slider" tabindex="0" aria-label="Color" aria-valuemin="0" aria-valuemax="100">
          <span class="ll-tape-window"><span class="ll-tape-track"></span></span>
          <span class="ll-tape-mark" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- LightRuler: the lamp through the day, built as the lamp is, head over base: two strips
         across the day, the top one lit white as strongly as the sunlight is at each moment,
         the one under it lit in the color the base shows then, as strongly; dark where a light
         is off. Your day's light runs between two white bars, your wake-up and lights-out
         times, like a clip's trim handles. The time showing is the tapes' yellow mark, a line
         down through both strips like a video's playhead, its time always over it. While it's
         at another time, now stays over the strips as a small hollow yellow ring, and a round
         ↺ button comes up beside Play a day: tap it (or the ring, or drag the mark onto it,
         Escape on the keyboard) to come back to now. Drag it, or play it. No visible title
         (the user, 2026-11-15: Wake up and Lights out under it already say what it is; "Your
         day" stays for screen readers). -->
    <div class="ruler-block">
      <div class="ruler-head">
        <h2 class="visually-hidden">Your day</h2>
        <div class="ruler-actions">
          <button class="ll-pill is-small to-now" type="button" id="to-now" aria-label="Back to now" title="Back to now"><svg class="icon" aria-hidden="true"><use href="#i-now"/></svg></button>
          <button class="ll-pill is-small play" type="button" id="play"><svg class="play-icon" aria-hidden="true"><use href="#i-play"/></svg><span id="play-label">Play a day</span></button>
        </div>
      </div>
      <div class="ll-ruler" id="ruler" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="1439" aria-keyshortcuts="Escape">
        <span class="day-strip is-sun" id="day-sun" aria-hidden="true"></span>
        <span class="day-strip is-color" id="day-color" aria-hidden="true"></span>
        <span class="day-live" id="live-ring" aria-hidden="true"></span>
        <span class="day-now" id="now-line" aria-hidden="true"><i></i><b class="day-now-time" id="now-time"></b></span>
      </div>
      <!-- Under the ruler, your two times: a white bar across the strips at the time, and
           under it the time over what it is. Drag the bar (or the
           time) sideways to move that time, the day's light moving with it, or tap it for the
           times sheet. -->
      <div class="ll-axis day-ends">
        <button class="day-end" type="button" id="edit-wake" aria-haspopup="dialog" aria-keyshortcuts="ArrowLeft ArrowRight"><span class="end-grip" aria-hidden="true"><i></i></span><span class="end-time" id="wake-text">7:00 AM</span><span class="end-caption">Wake up</span></button>
        <button class="day-end" type="button" id="edit-bed" aria-haspopup="dialog" aria-keyshortcuts="ArrowLeft ArrowRight"><span class="end-grip" aria-hidden="true"><i></i></span><span class="end-time" id="bed-text">11:00 PM</span><span class="end-caption">Lights out</span></button>
      </div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>

  <!-- The scenes for the part of the day showing, each with a small lamp lit as the scene
       lights it. Each wears its picture; the recommended one says why. Picking one closes the sheet,
       so you see the lamp change; arrow keys try them without closing. -->
  <section class="ll-sheet sheet scene-sheet" id="scene-sheet" role="dialog" aria-modal="true" aria-labelledby="scene-title">
    <span class="ll-grabber" aria-hidden="true"></span>
    <div class="ll-sheet-head">
      <div>
        <h2 class="ll-sheet-title" id="scene-title" tabindex="-1">Daytime</h2>
        <p class="ll-sheet-sub" id="scene-when">10:30 AM to 5:00 PM</p>
      </div>
      <button class="ll-done" type="button" data-close>Done</button>
    </div>
    <div class="ll-fields scenes" id="scenes" role="radiogroup" aria-label="Scene"></div>
  </section>

  <section class="ll-sheet sheet" id="times-sheet" role="dialog" aria-modal="true" aria-labelledby="times-title">
    <span class="ll-grabber" aria-hidden="true"></span>
    <div class="ll-sheet-head">
      <div>
        <h2 class="ll-sheet-title" id="times-title" tabindex="-1">Your times</h2>
        <p class="ll-sheet-sub">Light Life plans the day from these two and the sun where you live.</p>
      </div>
      <button class="ll-done" type="button" data-close>Done</button>
    </div>
    <div class="ll-fields">
      <div class="ll-field">
        <span class="ll-field-label"><svg aria-hidden="true"><use href="#i-sun"/></svg>Wake up</span>
        <span class="ll-stepper">
          <button class="ll-round step" type="button" data-field="wake" data-step="-15" aria-label="Wake up 15 minutes earlier">&minus;</button>
          <output id="wake-value" aria-live="polite">7:00 AM</output>
          <button class="ll-round step" type="button" data-field="wake" data-step="15" aria-label="Wake up 15 minutes later">+</button>
        </span>
      </div>
      <div class="ll-field">
        <span class="ll-field-label"><svg aria-hidden="true"><use href="#i-moon"/></svg>Lights out</span>
        <span class="ll-stepper">
          <button class="ll-round step" type="button" data-field="bed" data-step="-15" aria-label="Lights out 15 minutes earlier">&minus;</button>
          <output id="bed-value" aria-live="polite">11:00 PM</output>
          <button class="ll-round step" type="button" data-field="bed" data-step="15" aria-label="Lights out 15 minutes later">+</button>
        </span>
      </div>
    </div>
  </section>

  <section class="ll-sheet sheet is-tall" id="city-sheet" role="dialog" aria-modal="true" aria-labelledby="city-title">
    <span class="ll-grabber" aria-hidden="true"></span>
    <div class="ll-sheet-head">
      <div>
        <h2 class="ll-sheet-title" id="city-title" tabindex="-1">Where you live</h2>
        <p class="ll-sheet-sub">Light Life plans around the sun and the weather there.</p>
      </div>
      <button class="ll-done" type="button" data-close>Done</button>
    </div>
    <label class="search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="visually-hidden">Search for a city</span>
      <input type="search" id="city-input" placeholder="Search for your city" autocomplete="off" autocapitalize="words" spellcheck="false"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="city-results" enterkeyhint="search">
    </label>
    <p class="search-status" id="city-status" aria-live="polite"></p>
    <ul class="ll-fields results" id="city-results" role="listbox" aria-label="Cities"></ul>
    <p class="credit">Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </section>

  <span class="home-bar" aria-hidden="true"></span>
</div>

<script src="sky.js"></script>
<script src="app.js"></script>
</body>
</html>
