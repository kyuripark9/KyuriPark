<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* One black stage for every tile that shows a screen (README's Thumbnail rule, Stage; since
     2026-11-27): a laptop seen straight on (or a phone, ?device=phone) in a dark room, lit only
     by its own screen. 720 x 1000 (the tile's 18:25). render.mjs calls show() with each frame
     of the real app (capture.mjs) and screenshots it. ?glow= is the screen light's r, g, b. */
  :root {
    --glow: 255, 248, 235;     /* the screen's light, r g b (set per project) */
    --W: 600px;                /* the display's width; 16:10 */
    --top: 318px;              /* where the lid's top edge sits */
  }
  html, body { margin: 0; background: #050505; }
  .stage { position: relative; width: 720px; height: 1000px; overflow: hidden; background: #050505; }

  /* the room: almost black, lifted only where the screen throws light */
  .air {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 34% at 50% 50%, rgba(var(--glow), .085), transparent 70%),
      radial-gradient(85% 22% at 50% 76%, rgba(var(--glow), .07), transparent 75%);
  }

  /* the lid: a thin dark bezel round the display */
  .lid {
    position: absolute; left: 50%; top: var(--top); transform: translateX(-50%);
    width: calc(var(--W) + 22px); padding: 11px 11px 15px; box-sizing: border-box;
    border-radius: 16px 16px 4px 4px;
    background: #0d0d0e;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 0 0 1px #000;
  }
  .display { position: relative; width: var(--W); aspect-ratio: 16 / 10; border-radius: 3px; overflow: hidden; background: #000; }
  .display img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the screen's light leaking into the dark round the lid */
  .bloom {
    position: absolute; left: 50%; top: calc(var(--top) + 11px); transform: translateX(-50%) scale(1.06);
    width: var(--W); aspect-ratio: 16 / 10;
    filter: blur(38px) saturate(1.1); opacity: .42;
  }
  .bloom img { width: 100%; height: 100%; display: block; }

  /* the deck: the laptop's front edge, catching the screen's light along its top */
  .deck {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--top) + var(--W) * 10 / 16 + 26px);
    width: calc(var(--W) + 76px); height: 13px; border-radius: 2px 2px 9px 9px;
    background: linear-gradient(#2a2a2c, #141415 35%, #0a0a0b);
    box-shadow: inset 0 1px 0 rgba(var(--glow), .5), 0 1px 0 #000;
  }
  .deck::before { /* the notch where the lid opens */
    content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 96px; height: 5px; border-radius: 0 0 6px 6px; background: #0b0b0c;
  }
  /* the light pooled on the table in front, and the deck's contact shadow */
  .pool {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--top) + var(--W) * 10 / 16 + 40px);
    width: 760px; height: 240px;
    background: radial-gradient(50% 46% at 50% 0%, rgba(var(--glow), .16), rgba(var(--glow), .05) 55%, transparent 100%);
    filter: blur(6px);
  }
  .shadow {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(var(--top) + var(--W) * 10 / 16 + 38px);
    width: calc(var(--W) + 90px); height: 10px; border-radius: 50%;
    background: rgba(0,0,0,.9); filter: blur(4px);
  }
  /* film grain over all, so it reads as a photograph of a room, not a flat render */
  .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay; pointer-events: none; }
  /* the pointer, drawn where the capture put it (a headless screen has none), a little larger than life so it reads in a tile */
  .pointer { position: absolute; left: 0; top: 0; width: 13px; height: 20px; transform-origin: 0 0; display: none; }
  .pointer.on { display: block; }

  /* a phone instead (?device=phone): standing upright, straight on, its display 296 x 640 (the
     app's 390 x 844), its middle where the laptop's display has its middle */
  .phone { --PW: 296px; --PH: 640px; --ptop: 186px; }
  .phone .deck { display: none; }
  .phone .lid { top: var(--ptop); width: calc(var(--PW) + 18px); padding: 9px; border-radius: 46px; }
  .phone .display { width: var(--PW); height: var(--PH); aspect-ratio: auto; border-radius: 37px; }
  .phone .bloom { top: calc(var(--ptop) + 9px); width: var(--PW); height: var(--PH); aspect-ratio: auto; transform: translateX(-50%) scale(1.08); filter: blur(34px) saturate(1.3); opacity: .7; }
  .phone .pool { top: calc(var(--ptop) + var(--PH) + 14px); width: 560px; }
  .phone .shadow { top: calc(var(--ptop) + var(--PH) + 13px); width: calc(var(--PW) + 30px); }
</style>
</head>
<body>
<div class="stage">
  <div class="air"></div>
  <div class="bloom"><img id="b" alt=""></div>
  <div class="pool"></div>
  <div class="shadow"></div>
  <div class="deck"></div>
  <div class="lid"><div class="display"><img id="s" alt="">
    <svg class="pointer" id="p" viewBox="-1 -1 14 21"><path d="M0 0V16.2L3.9 12.5L6.4 18.3L9.1 17.2L6.6 11.5H12Z" fill="#000" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>
  </div></div>
  <svg class="grain" width="720" height="1000"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('glow')) document.documentElement.style.setProperty('--glow', q.get('glow'));
  if (q.get('device') === 'phone') document.querySelector('.stage').classList.add('phone');
  // src: the screen; ptr: {x, y} in the screen's CSS px (vw wide), or null
  window.show = async (src, ptr, vw = 960, big = 1.7) => {
    const s = document.getElementById('s'), b = document.getElementById('b'), p = document.getElementById('p');
    s.src = src; b.src = src;
    const k = s.parentElement.clientWidth / vw;
    p.classList.toggle('on', !!ptr);
    if (ptr) p.style.transform = `translate(${ptr.x * k}px, ${ptr.y * k}px) scale(${big})`;
    await Promise.all([s.decode(), b.decode()]);
    return true;
  };
  if (q.get('src')) show(q.get('src'));
</script>
</body>
</html>
