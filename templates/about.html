    <h1 class="visually-hidden">About</h1>

    <div class="about-intro">
      <figure class="about-portrait">
{{ portrait }}
      </figure>
      <div class="about-text">
{{ paragraphs }}
      </div>
    </div>

    <section class="split-section" aria-labelledby="experience-heading">
      <h2 id="experience-heading" class="section-heading">Experience</h2>
      <ul class="experience">
{{ experience }}
      </ul>
    </section>

    <section class="split-section" aria-labelledby="contact-heading">
      <h2 id="contact-heading" class="section-heading">Contact</h2>
      <ul class="link-list">
{{ contact_links }}
      </ul>
    </section>
