<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  {{ head_meta }}
  <script>document.documentElement.classList.add("js")</script>
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css?v={{ css_version }}">
  <script src="/assets/js/main.js?v={{ js_version }}" defer></script>
</head>
<body data-page="{{ page_name }}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header wrap">
    <a class="identity" href="/">{{ site_name }}</a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-menu">
        <li><a href="{{ work_url }}"{{ nav_work }}>Work</a></li>
        <li><a href="/archive/"{{ nav_archive }}>Archive</a></li>
        <li><a href="/about/"{{ nav_about }}>About</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="{{ main_class }}">
{{ content }}
  </main>

{{ footer }}</body>
</html>
